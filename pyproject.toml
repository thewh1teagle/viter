[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "viter"
dynamic = ["version"]
description = "Rusty forced aligner. Train, align, serve."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
keywords = ["forced-alignment", "speech", "kaldi", "textgrid", "mfa"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/thewh1teagle/viter"
Repository = "https://github.com/thewh1teagle/viter"

[project.scripts]
viter = "viter:main"

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "viter._viter"
features = ["pyo3/extension-module"]
